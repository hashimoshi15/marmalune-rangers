<!-- Boot splash: painted before the 4 MB of game code arrives. Self-contained (inline CSS/JS, no
     network), localised from a tiny built-in dictionary, framed exactly like the game (same rules as
     00b_screen.js: rotated 90deg / -90deg on upright phones following the way the phone was last held
     sideways, letterboxed 4:3-minimum landscape frame in a tall desktop window), progress driven by
     parsed module scripts (on the multi-file public site: the byte share of each script file's onload,
     MR_BOOT.ext / got / lost), then boot stages from 99_main.js (MR_BOOT.step / done / fail).
     data-mr-frame keeps 00b from rewriting this CSS. Also declares the web app manifest (home-screen
     installs: fullscreen, landscape) as a data: URL; harmless where unsupported (the public site links its
     own manifest.webmanifest and icons in <head>, which this script then leaves alone). -->
<style data-mr-frame="1">

  background:linear-gradient(180deg,#2b7fe0 0%,#4fa7f2 38%,#7ccdfb 72%,#a6e4ff 100%);color:#1e1a4d;font:800 16px/1.3 'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Arial Rounded MT Bold','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
